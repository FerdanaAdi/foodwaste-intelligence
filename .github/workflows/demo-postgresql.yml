name: Demo PostgreSQL 18 integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fwi_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: fwi_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fwi_test -d fwi_demo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FWI_TEST_DATABASE_URL: postgresql+psycopg://fwi_test:synthetic_ci_only@localhost:5432/fwi_demo_test
      FWI_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -v
      - run: python -I scripts/verify_kit.py
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:proxy
      - run: npm run build
