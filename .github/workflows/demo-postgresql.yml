name: Demo PostgreSQL 18 integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fwi_synthetic
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: fwi_synthetic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fwi_synthetic -d fwi_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FWI_TEST_DATABASE_URL: postgresql+psycopg://fwi_synthetic:synthetic_ci_only@localhost:5432/fwi_synthetic_test
      FWI_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -v
      - run: python -I scripts/verify_kit.py
