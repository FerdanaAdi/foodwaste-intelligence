name: Demo PostgreSQL 18 integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fwi_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: fwi_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fwi_test -d fwi_demo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FWI_TEST_DATABASE_URL: postgresql+psycopg://fwi_test:synthetic_ci_only@localhost:5432/fwi_demo_test
      FWI_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -v
      - run: python -I scripts/verify_kit.py
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:proxy
      - run: npm run build
  chromium-browser-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fwi_test
          POSTGRES_DB: fwi_demo_test
          # Ephemeral isolated CI service only: no password to leak in traces/logs.
          # This never modifies Windows PostgreSQL authentication/configuration.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fwi_test -d fwi_demo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FWI_TEST_DATABASE_URL: postgresql+psycopg://fwi_test@127.0.0.1:5432/fwi_demo_test
      FWI_REQUIRE_POSTGRES: '1'
      FWI_BROWSER_RUN_TOKEN: '${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Linux Chromium Browser E2E (no retries, one worker)
        run: npm run test:e2e:ci
        working-directory: frontend
      - name: Always clean and verify exact owned schemas
        if: always()
        run: python scripts/browser_e2e_harness.py cleanup
      - name: Upload browser report, failure screenshot/trace and database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/browser-evidence/
